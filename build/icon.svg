<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Terminal Container — Apple minimalism:
       one dark tile, one glyph, one accent. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#221b15"/>
      <stop offset="1" stop-color="#140f0a"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#tile)"/>

  <!-- prompt › _ -->
  <path d="M 320 372 L 536 512 L 320 652"
        fill="none" stroke="#d97757" stroke-width="80"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="592" y="480" width="140" height="64" rx="32" fill="#d97757"/>
</svg>
