<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
  <title>Web Preview</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      --text: light-dark(#1d1d1f, #f5f5f7);
      --muted: light-dark(rgba(60, 60, 67, .68), rgba(235, 235, 245, .58));
      --line: light-dark(rgba(60, 60, 67, .15), rgba(255, 255, 255, .14));
      --surface: light-dark(rgba(255, 255, 255, .5), rgba(38, 38, 40, .46));
      --accent: #d97757;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        radial-gradient(circle at 70% 18%, color-mix(in srgb, var(--accent) 13%, transparent), transparent 38%),
        linear-gradient(145deg, color-mix(in srgb, white 5%, transparent), transparent 44%);
    }

    main {
      width: min(540px, 100%);
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 24px 70px rgba(0,0,0,.1);
      backdrop-filter: blur(28px) saturate(150%);
      -webkit-backdrop-filter: blur(28px) saturate(150%);
    }

    .icon {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      margin-bottom: 22px;
      border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line));
      border-radius: 15px;
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      color: var(--accent);
      font-size: 23px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 9px 22px color-mix(in srgb, var(--accent) 16%, transparent);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(24px, 4vw, 32px);
      font-weight: 650;
      letter-spacing: -.035em;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .shortcuts {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 24px;
    }

    a {
      display: inline-flex;
      align-items: center;
      height: 34px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: color-mix(in srgb, var(--surface) 78%, transparent);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 540;
      text-decoration: none;
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }

    a:hover {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--accent) 48%, var(--line));
      background: color-mix(in srgb, var(--accent) 11%, var(--surface));
    }

    kbd {
      margin-left: 7px;
      padding: 2px 5px;
      border: 1px solid var(--line);
      border-radius: 5px;
      color: var(--muted);
      font: 10px/1.2 ui-monospace, "SF Mono", monospace;
    }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">◎</div>
    <h1>网页预览</h1>
    <p>在上方地址栏输入本地开发地址或网页 URL。按 <strong>⌘L</strong> 可随时回到地址栏。</p>
    <div class="shortcuts">
      <a href="http://localhost:3000">localhost:3000</a>
      <a href="http://localhost:5173">localhost:5173</a>
      <a href="http://localhost:8080">localhost:8080</a>
    </div>
  </main>
</body>
</html>
